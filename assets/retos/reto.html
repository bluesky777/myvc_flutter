    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;

      if(g){g.style.transform=`translate(${dx}px,${dy}px) rotate(4deg)`;const t=document.elementFromPoint(ev.clientX,ev.clientY),d=t&&t.closest("[data-drop]");
        if(d!==over){over&&over.classList.remove("over");over=d;over&&over.classList.add("over")}}};
    const up=ev=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
      over&&over.classList.remove("over");
      if(g){g.remove();el.classList.remove("dragging");if(over){sfx.drop();onDrop(over,ev)}}else if(ev.type==="pointerup"){sfx.pop();onTap&&onTap()}};
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  });
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap&&onTap()}});
}

}
function monsterSVG(m){
  const col=COLORS[m.color]||"#cfd6dc",dk="rgba(0,0,0,.18)";let s="";
  for(let i=0;i<m.legs;i++){const x=100+(i-(m.legs-1)/2)*30;s+=`<g class="mp leg" style="--i:${i}"><rect x="${x-7}" y="168" width="14" height="34" rx="6" fill="${col}" stroke="#15304d" stroke-width="3"/><ellipse cx="${x+4}" cy="204" rx="13" ry="7" fill="${col}" stroke="#15304d" stroke-width="3"/></g>`}
  for(let i=0;i<m.arms;i++){const side=i%2?1:-1,lv=Math.floor(i/2),y=118+lv*24,x0=100+side*56;s+=`<g class="mp arm ${side>0?"r":"l"}" style="--i:${i}"><path d="M${x0} ${y} q${side*18} -4 ${side*32} -20" fill="none" stroke="#15304d" stroke-width="13" stroke-linecap="round"/><path d="M${x0} ${y} q${side*18} -4 ${side*32} -20" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"/><circle cx="${x0+side*32}" cy="${y-20}" r="8" fill="${col}" stroke="#15304d" stroke-width="3"/></g>`}
  for(let i=0;i<m.horns;i++){const x=100+(i-(m.horns-1)/2)*30;s+=`<path class="mp horn" style="--i:${i}" d="M${x-10} 66 L${x} 34 L${x+10} 66z" fill="#ffc23a" stroke="#15304d" stroke-width="3" stroke-linejoin="round"/>`}
  s+=`<ellipse cx="100" cy="122" rx="62" ry="60" fill="${col}" stroke="#15304d" stroke-width="4"/><ellipse cx="84" cy="96" rx="22" ry="12" fill="rgba(255,255,255,.25)"/>`;
  const rows=m.eyes>3?[Math.ceil(m.eyes/2),Math.floor(m.eyes/2)]:[m.eyes];let k=0;
  rows.forEach((n,ri)=>{for(let i=0;i<n;i++){const x=100+(i-(n-1)/2)*30,y=100+ri*28;s+=`<g class="mp eye" style="--i:${k++}"><circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="#15304d" stroke-width="3"/><circle class="pupil" cx="${x+2}" cy="${y+2}" r="5" fill="#15304d"/></g>`}});
  s+=`<path d="M78 ${m.eyes>3?160:146} q22 18 44 0" fill="${dk}" stroke="#15304d" stroke-width="3.5" stroke-linecap="round"/><path d="M90 ${m.eyes>3?163:149} l4 7 l4 -6" fill="#fff"/>`;
  return`<svg viewBox="-12 0 224 215" aria-hidden="true">${s}</svg>`;
}

function layoutCW(words){
  const W=words.map((x,k)=>({w:LET(x[0]),clue:x[1],k})).filter(x=>x.w.length>=2).sort((a,b)=>b.w.length-a.w.length);
  const cells=new Map(),placed=[],K=(x,y)=>x+","+y;
  const can=(w,x,y,dir)=>{const dx=dir?0:1,dy=dir?1:0;if(cells.has(K(x-dx,y-dy))||cells.has(K(x+dx*w.length,y+dy*w.length)))return 0;let cross=0;
    for(let i=0;i<w.length;i++){const cx=x+dx*i,cy=y+dy*i,c=cells.get(K(cx,cy));if(c){if(c!==w[i])return 0;cross++}else if(cells.has(K(cx+dy,cy+dx))||cells.has(K(cx-dy,cy-dx)))return 0}
    return cross};
  const put=(o,x,y,dir)=>{for(let i=0;i<o.w.length;i++)cells.set(K(x+(dir?0:i),y+(dir?i:0)),o.w[i]);placed.push({...o,x,y,dir,ord:placed.length})};
  W.forEach((o,n)=>{if(!n){put(o,0,0,0);return}let best=null;
    for(const p of placed)for(let i=0;i<p.w.length;i++)for(let j=0;j<o.w.length;j++)if(p.w[i]===o.w[j]){
      const dir=1-p.dir,px=p.x+(p.dir?0:i),py=p.y+(p.dir?i:0),x=px-(dir?0:j),y=py-(dir?j:0),c=can(o.w,x,y,dir);if(c&&(!best||c>best.c))best={x,y,dir,c}}
    if(best)put(o,best.x,best.y,best.dir)});
  const xs=placed.flatMap(p=>[p.x,p.x+(p.dir?0:p.w.length-1)]),ys=placed.flatMap(p=>[p.y,p.y+(p.dir?p.w.length-1:0)]),mx=Math.min(...xs),my=Math.min(...ys);
  placed.forEach(p=>{p.x-=mx;p.y-=my});placed.sort((a,b)=>a.y-b.y||a.x-b.x);
  const starts=[];placed.forEach(p=>{const k=K(p.x,p.y);if(!starts.includes(k))starts.push(k);p.n=starts.indexOf(k)+1;p.cells=Array.from({length:p.w.length},(_,i)=>K(p.x+(p.dir?0:i),p.y+(p.dir?i:0)))});
  const sol={};placed.forEach(p=>p.cells.forEach((k,i)=>sol[k]=p.w[i]));
  return{placed,cols:Math.max(...xs)-mx+1,rows:Math.max(...ys)-my+1,sol,skipped:W.filter(o=>!placed.some(p=>p.k===o.k)).map(o=>words[o.k][0])};
}

const MAPN=4,DIRS=[[0,-1],[1,0],[0,1],[-1,0]],DIRW=["up","right","down","left"];
function walk(cmds){let x=0,y=MAPN-1,d=0;const path=[[x,y]];let bump=false;
  cmds.forEach(c=>{if(c==="L")d=(d+3)%4;else if(c==="R")d=(d+1)%4;else{const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||ny<0||nx>=MAPN||ny>=MAPN){bump=true;return}x=nx;y=ny;path.push([x,y])}});
  return{x,y,d,path,bump}}
function dirText(steps){const out=[];for(let i=0;i<steps.length;i++){const c=steps[i];if(c==="S"){let n=1;while(steps[i+1]==="S"){n++;i++}out.push(n===1?"Go straight one block.":`Go straight ${numWord(n)} blocks.`)}else out.push(c==="L"?"Turn left.":"Turn right.")}
  return`You are at the start, looking up the street. ${out.join(" ")} Stop!`}

/* ---------- utilidades de texto: comparar sin castigar mayúsculas, tildes ni signos ---------- */
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const lcs=(a,b)=>{const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);return m[a.length][b.length]};
const wordSim=(got,want)=>{const a=norm(got).split(" ").filter(Boolean),b=norm(want).split(" ").filter(Boolean);return b.length?lcs(a,b)/Math.max(a.length,b.length):0};

/*
 * EMO y ES (palabra en minúscula → emoji / traducción) son los mapas COMPARTIDOS con otras pantallas
 * (inglés). Quien los use sólo puede AÑADIR palabras nuevas; nunca cambiar ni borrar una que ya está:
 * el motor y la calificación del backend dependen de ellas.
 * mkQ(type, tk, r, gi) → { type, title, cfg }: la pregunta que arma T[type].assist(tk, r, gi), como en retos.js.
 */
return { $, $$, esc, clone, hash, rngOf, shuf, take, csv, lines, tone, sfx, speak, SAY_ICON, MASCOT, mascot, drag, BANK, emojiFor, plural, art, numWord, items, simple, sim, parseWE, SK, SOLVE, T, bandOf, silenciar, EMO, ES, mkQ };

</head>
<body>
<div id="marco"><div id="caja" class="reto"></div></div>
<script>
(() => {
  const { T, esc, speak, SAY_ICON } = motor;
  const caja = document.getElementById('caja');
  const mandar = (canal, dato) => { if (window[canal]) window[canal].postMessage(typeof dato === 'string' ? dato : JSON.stringify(dato)); };

  window.pintarReto = (d) => {
    caja.replaceChildren();
    const t = T[d.reto];
    if (!t) {
      caja.innerHTML = '<p class="hint">Este reto (' + esc(d.reto) + ') no viene en esta versión de la app. Actualízala o responde la pregunta en la web.</p>';
      return;
    }
    caja.innerHTML = '<div class="qtitle"><h2>' + esc(t.title) + '</h2><button type="button" class="say" aria-label="Escuchar la instrucción">' + SAY_ICON + '</button></div>'
      + '<p class="qes">' + esc(t.es) + '</p><div class="qbody"></div>';
    caja.querySelector('.qtitle .say').onclick = () => speak(t.title, 0.85);
    const cuerpo = caja.querySelector('.qbody');
    if (d.soloLectura) caja.setAttribute('inert', ''); else caja.removeAttribute('inert');
    try {
      const s = d.estado ? JSON.parse(JSON.stringify(d.estado)) : t.init(d.cfg);
      t.render(cuerpo, d.cfg, s, d.soloLectura ? () => {} : () => {
        let hecho = false;
        try { hecho = !!t.done(d.cfg, s); } catch (e) {}
        mandar('Reto', { estado: s, hecho });
      });
    } catch (e) {
      cuerpo.innerHTML = '<p class="hint">Faltan datos para mostrar este reto.</p>';
    }
  };

  // Se mide la caja y no el body: el body crece con la WebView y nunca encogería.
  new ResizeObserver(() => mandar('Alto', String(Math.ceil(caja.getBoundingClientRect().height)))).observe(caja);
  mandar('Listo', '');
})();
</script>
</body>
</html>
