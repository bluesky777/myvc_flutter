<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Si la app no cuelga de la raíz del dominio sino de una carpeta, se compila
    con `flutter build web --base-href /la-carpeta/` y este marcador se
    sustituye solo. Antes aquí había un "/" a pelo, y con él la app en una
    subcarpeta salía en blanco.

    Más detalles:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App para MiColeVirtual">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mi Cole Virtual">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mi Cole Virtual</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    flutter_bootstrap.js lo genera el propio build y se encarga de cargar el
    motor, el service worker y main.dart.js. Sustituye al script a mano que
    había aquí, de los tiempos de Flutter 2, que el propio compilador ya
    señalaba como deprecado.

    Se puede personalizar:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
